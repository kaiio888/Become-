<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Become AI</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header>
    <div class="logo">BECOME<span>AI</span></div>
    <button class="research-btn" onclick="research()">🔎 Research</button>
  </header>

  <main>
    <div class="hero">
      <div class="badge">✦ Your AI, built to become better</div>

      <h1>Ask anything.<br><span>I'll figure it out.</span></h1>

      <p>Think. Research. Understand. Answer.</p>

      <div class="chat-box">
        <textarea id="question" placeholder="Ask Become AI anything..."></textarea>

        <div class="bottom">
          <span>Become AI</span>
          <button onclick="askAI()">➤</button>
        </div>
      </div>

      <div id="answer"></div>
    </div>
  </main>

  <footer>
    <p>© 2026 Become AI</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
